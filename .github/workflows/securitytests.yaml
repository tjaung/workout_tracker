name: Security Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-tests:
    uses: tjaung/cs6620_project/.github/workflows/securitytests.yaml@tj/lambda
    permissions:
      id-token: write
      contents: read
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}